# Only GitHub Actions: the scanners have no pinned dependency manifest, they
# import whichever ruff or sqlfluff the corpus under test is installed with.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      # init and analyze must move together: a PR that bumps only one of
      # them leaves the workflow on mismatched versions and CodeQL fails.
      codeql-action:
        patterns:
          - "github/codeql-action*"
