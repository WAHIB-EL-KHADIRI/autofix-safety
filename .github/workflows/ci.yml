name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d5156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip pytest ruff sqlfluff

      - name: Test
        run: python -m pytest tests/ -q

  smoke:
    name: scan a corpus end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d5156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip ruff

      - name: Run the ruff scanner over this repository
        run: |
          python scanners/ruff_fix_safety.py . findings.json
          cat findings.json
